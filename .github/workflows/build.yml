name: App build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build win64
    runs-on: windows-latest
    env:
      OS: win64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "MSVC not found" }
          "MSVC_VERSION=$($vs -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MSVC: $vs"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ env.OS }}-${{ hashFiles('./share/ci/*.py') }}

      - name: Build
        shell: bash
        env:
          SKIP_QT_SSL: "1"
        run: |
          python ./share/ci/release.py
          echo "artifact=`python ./share/ci/release.py artifact_name`" >> $GITHUB_ENV

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}
